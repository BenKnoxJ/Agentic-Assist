[tool.uv.workspace]
members = ["apps/*", "libs/connectors/*"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "jsonschema>=4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gojo"]

[tool.pytest.ini_options]
testpaths = ["apps", "libs"]
asyncio_mode = "auto"
