[project]
name = "gojo-graph"
version = "0.1.0"
description = "Read-only Microsoft Graph mail connector: fetches, never reasons"
requires-python = ">=3.12"
dependencies = [
    # Both are already in the environment transitively; declared here because
    # this package imports them first-party (same rule as aiosqlite in gojo).
    "httpx>=0.28",
    "msal>=1.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gojo_graph"]
