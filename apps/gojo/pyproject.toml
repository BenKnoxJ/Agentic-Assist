[project]
name = "gojo"
version = "0.1.0"
description = "Multi-agent orchestrator with a Microsoft Teams surface"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain-core>=1.2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gojo"]
