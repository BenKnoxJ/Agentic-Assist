[project]
name = "gojo"
version = "0.1.0"
description = "Multi-agent orchestrator with a Microsoft Teams surface"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.1",
    # Imported directly by gojo.outbox; do not rely on the checkpointer's
    # transitive resolution for a first-party import (6.1, ADR 0008).
    "aiosqlite>=0.22",
    "langchain-core>=1.2.22",
    "claude-agent-sdk>=0.2.128",
    # Teams surface. Verified against PyPI 4 Aug 2026: 1.3.0 current.
    # The doc's 1.1.0 was stale; botbuilder-python is archived (5.1).
    "microsoft-agents-hosting-core>=1.3.0",
    "microsoft-agents-hosting-fastapi>=1.3.0",
    "microsoft-agents-hosting-teams>=1.3.0",
    "microsoft-agents-authentication-msal>=1.3.0",
    # Step 4 read connectors (workspace members, resolved locally below).
    "gojo-graph",
    "gojo-jira",
    # Imported directly by agents/runner.py for the trace bridge (9.2, 13.8);
    # transitive via langgraph until now, first-party import from step 4.
    "langsmith>=0.10",
]

[tool.uv.sources]
gojo-graph = { workspace = true }
gojo-jira = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gojo"]
